<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Vault — A Midnight Heist</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; background: #0a0c1a; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
  #wrap { width: min(1280px, 100vw); }
  canvas { display: block; width: 100%; height: auto; background: #0d0f22; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <p id="status" class="visually-hidden" aria-live="polite"></p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
